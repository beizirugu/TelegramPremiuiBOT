[project]
name = "fragment-premium-gift-bot"
version = "0.1.0"
description = "Telegram bot for gifting Telegram Premium through Fragment and TON."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "python-telegram-bot>=21,<23",
  "tonutils>=2.1,<3",
]

[project.scripts]
fragment-premium-gift-bot = "premium_bot.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"
